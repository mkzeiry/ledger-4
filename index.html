  document.addEventListener('input',e=>{if(e.target.matches('.rxfield')){const card=e.target.closest('[data-instance]'),r=db.routines.find(x=>x.id===document.querySelector('[data-save-routine]')?.dataset.saveRoutine),x=r?.exercises.find(x=>x.instanceId===card?.dataset.instance),f=e.target.dataset.field;if(x&&f){x[f]=['sets','repMin','repMax','rest'].includes(f)?Math.max(1,+e.target.value||1):['targetRIR','increment'].includes(f)?+e.target.value||0:e.target.value;if(f==='sets')x.sets=Math.min(20,x.sets);save()}}if(e.target.matches('.setfield,.settype')){const row=e.target.closest('[data-set]'),card=e.target.closest('[data-wx]'),x=db.activeWorkout?.exercises.find(x=>x.instanceId===card?.dataset.wx),s=x?.sets.find(s=>s.id===row?.dataset.set);if(s){if(e.target.matches('.settype'))s.type=e.target.value;else s[e.target.dataset.field]=e.target.value;save()}}if(e.target.id==='workoutName'&&db.activeWorkout){db.activeWorkout.name=e.target.value;save()}if(e.target.id==='workoutNotes'&&db.activeWorkout){db.activeWorkout.notes=e.target.value;save()}if(e.target.id==='exerciseSearch'){clearTimeout(window._searchT);window._searchT=setTimeout(()=>picker(window._picker.callback,window._picker.muscle,e.target.value,window._picker.equipment),180)}});
  document.addEventListener('change',e=>{if(e.target.id==='progressExercise'){selectedExercise=e.target.value;renderProgress()}if(e.target.id==='themeSetting'){db.settings.theme=e.target.value;save()}if(e.target.id==='unitSetting'){db.settings.defaultUnit=e.target.value;save()}if(e.target.id==='equipmentFilter'&&window._picker){picker(window._picker.callback,window._picker.muscle,window._picker.query,e.target.value)}if(e.target.id==='importFile'&&e.target.files[0]){importPreview(e.target.files[0]);e.target.value=''}});
  document.getElementById('settingsBtn').onclick=settings;document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});document.getElementById('restTimer').addEventListener('click',e=>{const v=e.target.dataset.rest;if(v==='skip'){restEnd=0;updateRest()}else if(v)restEnd+=+v*1000});
  window.addEventListener('beforeunload',saveWorkoutInputs);window.addEventListener('resize',()=>{if(currentView==='progress'&&selectedExercise)drawProgress()});matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',applyTheme);
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  applyTheme();render();loadExerciseLibrary();
})();
