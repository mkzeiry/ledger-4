<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0d10" />
<title>Progression — Workout Tracker</title>
<style>
:root{
  --bg:#0b0d10;--panel:#12161b;--panel2:#171c22;--text:#f5f7fa;--muted:#929ba8;--border:#26303a;
  --accent:#6fe39d;--accent2:#183b27;--warn:#f5c769;--danger:#ff7a7a;--blue:#76b7ff;--purple:#b7a1ff;
  --shadow:0 16px 40px rgba(0,0,0,.28);--r:18px;--r2:14px;
}
[data-theme="light"]{
  --bg:#f5f7f9;--panel:#ffffff;--panel2:#f0f3f6;--text:#11161c;--muted:#66717f;--border:#dbe2e8;
  --accent:#157f45;--accent2:#def4e6;--warn:#9a6c00;--danger:#c83f3f;--blue:#246fb8;--purple:#7256b7;
  --shadow:0 14px 35px rgba(25,35,45,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:780px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid color-mix(in srgb,var(--border) 65%,transparent)}
.topbar-inner{max-width:780px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}.logo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#07140c;display:grid;place-items:center;font-weight:1000}
.top-actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:12px;min-width:42px;height:42px;padding:0 12px}
main{padding-top:18px}.view{display:none}.view.active{display:block}.page-title{font-size:28px;line-height:1.1;margin:0 0 4px;font-weight:850;letter-spacing:-.7px}.sub{color:var(--muted);font-size:14px}.section{margin:22px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.section-title{font-size:17px;font-weight:800;margin:0}.linkbtn{border:0;background:none;color:var(--accent);padding:4px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.card.flat{box-shadow:none}.card+.card{margin-top:10px}
.hero{background:linear-gradient(150deg,var(--panel),color-mix(in srgb,var(--accent2) 42%,var(--panel)));overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-80px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.hero .eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}.hero h2{font-size:25px;margin:7px 0 3px;letter-spacing:-.6px}.hero .meta{color:var(--muted);font-size:14px;margin-bottom:16px}
.btn{border:0;border-radius:14px;min-height:46px;padding:11px 15px;font-weight:800;background:var(--panel2);color:var(--text)}.btn.primary{background:var(--accent);color:#07140c}.btn.secondary{border:1px solid var(--border);background:transparent}.btn.danger{background:color-mix(in srgb,var(--danger) 17%,var(--panel));color:var(--danger)}.btn.small{min-height:38px;padding:8px 11px;border-radius:11px;font-size:13px}.btn.full{width:100%}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:14px}.metric .v{font-size:23px;font-weight:850;letter-spacing:-.5px}.metric .k{color:var(--muted);font-size:12px;margin-top:3px}.metric .delta{font-size:12px;margin-top:7px;color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--border)}.li-main{min-width:0}.li-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li-sub{font-size:12px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 9px;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:750}.pill.good{background:var(--accent2);color:var(--accent)}.pill.warn{background:color-mix(in srgb,var(--warn) 13%,var(--panel2));color:var(--warn)}.pill.blue{background:color-mix(in srgb,var(--blue) 13%,var(--panel2));color:var(--blue)}
.progressbar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px}.progressbar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.bottomnav-inner{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navbtn{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:6px 2px 4px;font-size:10px;font-weight:700;min-height:49px;display:flex;flex-direction:column;align-items:center;gap:3px}.navbtn .ico{font-size:20px;line-height:20px}.navbtn.active{color:var(--accent);background:color-mix(in srgb,var(--accent2) 55%,transparent)}
.empty{padding:24px 12px;text-align:center;color:var(--muted)}
.routine-card .top{display:flex;justify-content:space-between;gap:10px}.routine-name{font-size:19px;font-weight:820}.routine-exs{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}.routine-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.workout-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.session-timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}.exercise-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin:12px 0;overflow:hidden}.exercise-header{padding:14px 14px 12px;border-bottom:1px solid var(--border)}.exercise-title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.exercise-name{font-weight:820;font-size:17px}.exercise-presc{font-size:12px;color:var(--muted);margin-top:3px}.suggest{margin-top:10px;padding:10px 11px;border-radius:12px;background:var(--panel2);display:flex;justify-content:space-between;gap:10px;align-items:center}.suggest .s-main{font-size:13px}.suggest strong{color:var(--accent)}
.set-table{width:100%;border-collapse:collapse}.set-table th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;text-align:center;padding:9px 4px}.set-table td{padding:5px 4px;text-align:center;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent)}.set-table td:first-child,.set-table th:first-child{padding-left:10px}.set-table td:last-child,.set-table th:last-child{padding-right:10px}.setnum{font-size:12px;font-weight:800;color:var(--muted)}.prev{font-size:11px;color:var(--muted);white-space:nowrap}.setinput{width:100%;min-width:52px;max-width:78px;height:40px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;text-align:center;font-size:16px}.complete-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--panel2);color:var(--muted);font-weight:900}.complete-btn.done{background:var(--accent);color:#07140c;border-color:var(--accent)}.exercise-footer{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.note-input{width:100%;margin-top:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 11px;resize:vertical;min-height:42px}
.restbar{position:sticky;bottom:76px;z-index:15;margin:10px 0;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow);display:none}.restbar.active{display:flex;align-items:center;justify-content:space-between;gap:10px}.resttime{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--panel2);padding:4px;border-radius:13px;gap:3px}.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;font-weight:750;font-size:12px}.seg button.active{background:var(--panel);color:var(--text)}
.form-group{margin:12px 0}.label{display:block;font-size:12px;color:var(--muted);font-weight:750;margin:0 0 6px}.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;min-height:44px;padding:10px 12px;font-size:16px}.textarea{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.checkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.switch{width:50px;height:30px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);position:relative}.switch:after{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;border-radius:50%;background:var(--muted);transition:.18s}.switch.on{background:var(--accent2);border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}.switch.on:after{left:22px;background:var(--accent)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;padding:0}.modal.open{display:flex}.sheet{width:100%;max-width:780px;max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--border);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.3)}.sheet-head{position:sticky;top:-14px;z-index:3;background:var(--bg);padding:10px 0 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);margin-bottom:12px}.sheet-title{font-size:20px;font-weight:850}.closex{width:38px;height:38px;border:0;border-radius:50%;background:var(--panel2);color:var(--text);font-size:20px}
.builder-ex{border:1px solid var(--border);background:var(--panel);border-radius:15px;padding:12px;margin:8px 0}.builder-ex .rowtop{display:flex;align-items:center;justify-content:space-between;gap:8px}.drag{color:var(--muted);font-size:18px}.builder-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.builder-fields .input{padding:8px 6px;text-align:center;min-height:40px;font-size:14px}.builder-label{font-size:9px;color:var(--muted);text-align:center;text-transform:uppercase}.movebtns{display:flex;gap:4px}.movebtns button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
.chart{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;overflow:hidden}.chart svg{display:block;width:100%;height:210px}.chart .axis{stroke:var(--border);stroke-width:1}.chart .line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart .dot{fill:var(--accent)}.chart text{fill:var(--muted);font-size:10px}
.barrow{margin:12px 0}.barhead{display:flex;justify-content:space-between;gap:10px;font-size:13px}.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:var(--blue);border-radius:99px}
.pr{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}.pr-icon{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--warn) 14%,var(--panel2));display:grid;place-items:center;color:var(--warn);font-size:20px}.pr-val{font-weight:850}.pr-date{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);z-index:80;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:750;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{font-size:11px;color:var(--muted)}.dangerzone{border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
@media(max-width:460px){.grid3{grid-template-columns:repeat(2,1fr)}.form-grid.three{grid-template-columns:1fr 1fr}.builder-fields{grid-template-columns:repeat(2,1fr)}.page-title{font-size:25px}.set-table th:nth-child(2),.set-table td:nth-child(2){max-width:80px}.app{padding:0 12px}.topbar-inner{padding:0 12px}}
@media(min-width:650px){.desktop-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:12px}.bottomnav-inner{max-width:600px}.sheet{border-radius:24px;margin-bottom:18px;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="logo">P</div><span>Progression</span></div><div class="top-actions"><button id="themeBtn" class="iconbtn" aria-label="Toggle theme">◐</button></div></div></header>
<div class="app"><main>
<section id="homeView" class="view active"></section>
<section id="workoutView" class="view"></section>
<section id="routinesView" class="view"></section>
<section id="progressView" class="view"></section>
<section id="moreView" class="view"></section>
</main></div>
<nav class="bottomnav"><div class="bottomnav-inner">
<button class="navbtn active" data-view="home"><span class="ico">⌂</span><span>Home</span></button>
<button class="navbtn" data-view="workout"><span class="ico">＋</span><span>Workout</span></button>
<button class="navbtn" data-view="routines"><span class="ico">▦</span><span>Routines</span></button>
<button class="navbtn" data-view="progress"><span class="ico">↗</span><span>Progress</span></button>
<button class="navbtn" data-view="more"><span class="ico">•••</span><span>More</span></button>
</div></nav>
<div id="modal" class="modal" aria-hidden="true"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden />
<script>
(() => {
'use strict';
const KEY='progression-workout-data-v1';
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const round=(n,d=1)=>Math.round(Number(n)*10**d)/10**d;
const todayISO=()=>new Date().toISOString().slice(0,10);
const dateFmt=iso=>{if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined})};
const dtFmt=iso=>new Date(iso).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const mmss=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const e1rm=(w,r)=>r>0? w*(1+r/30):0;
const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const exercises=[
 ['incline_db_press','Incline Dumbbell Press','Chest',['Chest'],['Front delts','Triceps'],2,'kg'],
 ['incline_machine_press','Incline Machine Press','Chest',['Chest'],['Front delts','Triceps'],5,'kg'],
 ['chest_supported_row','Chest-Supported Row','Back',['Upper back','Lats'],['Biceps','Rear delts'],5,'kg'],
 ['flat_db_press','Flat Dumbbell Press','Chest',['Chest'],['Front delts','Triceps'],2,'kg'],
 ['converging_chest_press','Converging Chest Press','Chest',['Chest'],['Front delts','Triceps'],5,'kg'],
 ['neutral_lat_pulldown','Neutral-Grip Lat Pulldown','Back',['Lats'],['Biceps','Upper back'],10,'lb'],
 ['lat_pulldown','Lat Pulldown','Back',['Lats'],['Biceps','Upper back'],5,'kg'],
 ['cable_lateral_raise','Cable Lateral Raise','Shoulders',['Side delts'],[],1,'kg'],
 ['lean_cable_lateral_raise','Lean-Away Cable Lateral Raise','Shoulders',['Side delts'],[],1,'kg'],
 ['reverse_pec_deck','Reverse Pec Deck','Shoulders',['Rear delts'],['Upper back'],5,'kg'],
 ['rear_delt_cable','Cable Rear-Delt Fly','Shoulders',['Rear delts'],['Upper back'],2.5,'kg'],
 ['rope_pushdown','Rope Triceps Pushdown','Arms',['Triceps'],[],2.5,'kg'],
 ['oh_cable_triceps','Supported Overhead Cable Triceps Extension','Arms',['Triceps'],[],2.5,'kg'],
 ['preacher_curl','Preacher Curl','Arms',['Biceps'],[],2.5,'kg'],
 ['incline_db_curl','Incline-Supported Dumbbell Curl','Arms',['Biceps'],['Forearms'],2,'kg'],
 ['cable_curl','Cable Curl','Arms',['Biceps'],['Forearms'],2.5,'kg'],
 ['leg_press','Leg Press','Legs',['Quads','Glutes'],['Hamstrings'],10,'kg'],
 ['seated_leg_curl','Seated Leg Curl','Legs',['Hamstrings'],['Calves'],5,'kg'],
 ['lying_leg_curl','Lying Leg Curl','Legs',['Hamstrings'],['Calves'],5,'kg'],
 ['leg_extension','Leg Extension','Legs',['Quads'],[],5,'kg'],
 ['hip_thrust','Hip Thrust / Glute Drive','Legs',['Glutes'],['Hamstrings'],5,'kg'],
 ['seated_calf','Seated Calf Raise','Legs',['Calves'],[],5,'kg'],
 ['side_plank','Side Plank','Core',['Core'],[],5,'sec'],
 ['rdl','Romanian Deadlift','Legs',['Hamstrings','Glutes'],['Lower back'],5,'kg'],
 ['split_squat','Hand-Supported Split Squat / Step-Up','Legs',['Quads','Glutes'],['Hamstrings'],2,'kg'],
 ['hip_abduction','Hip Abduction Machine','Legs',['Glutes'],[],5,'kg'],
 ['hip_adduction','Hip Adduction Machine','Legs',['Adductors'],[],5,'kg'],
 ['standing_calf','Straight-Knee Calf Raise','Legs',['Calves'],[],5,'kg'],
 ['pallof','Pallof Press','Core',['Core'],[],2.5,'kg'],
 ['wide_high_row','Chest-Supported Wide / High Row','Back',['Upper back','Rear delts'],['Biceps','Lats'],5,'kg']
].map(x=>({id:x[0],name:x[1],category:x[2],primary:x[3],secondary:x[4],defaultIncrement:x[5],unit:x[6],custom:false}));

function rx(exerciseId,sets,repMin,repMax,targetRir,restSec,increment){return {id:uid('rx'),exerciseId,sets,repMin,repMax,targetRir,restSec,increment};}
function defaultState(){return {
 schema:1, createdAt:new Date().toISOString(), settings:{theme:'dark',autoTimer:true,secondarySetFactor:.5}, exercises:clone(exercises),
 routines:[
  {id:'r_upper_a',name:'Upper A',weekday:6,version:1,archivedVersions:[],exercises:[
   rx('incline_db_press',3,6,10,2,150,2),rx('chest_supported_row',3,8,12,2,120,5),rx('flat_db_press',2,8,12,2,120,2),rx('neutral_lat_pulldown',3,8,12,2,120,10),rx('cable_lateral_raise',3,12,20,2,75,1),rx('reverse_pec_deck',2,12,20,2,75,5),rx('rope_pushdown',2,10,15,2,75,2.5),rx('preacher_curl',2,8,12,2,75,2.5)
  ]},
  {id:'r_lower_a',name:'Lower A',weekday:0,version:1,archivedVersions:[],exercises:[
   rx('leg_press',3,8,12,2,150,10),rx('seated_leg_curl',3,8,12,2,120,5),rx('leg_extension',2,10,15,2,90,5),rx('hip_thrust',3,8,12,2,150,5),rx('seated_calf',3,10,15,2,90,5),rx('side_plank',2,30,45,2,60,5)
  ]},
  {id:'r_upper_b',name:'Upper B',weekday:2,version:1,archivedVersions:[],exercises:[
   rx('converging_chest_press',3,6,10,2,150,5),rx('wide_high_row',3,8,12,2,120,5),rx('incline_db_press',2,8,12,2,120,2),rx('lat_pulldown',2,8,12,2,120,5),rx('lean_cable_lateral_raise',3,12,20,2,75,1),rx('reverse_pec_deck',2,12,20,2,75,5),rx('oh_cable_triceps',3,10,15,2,75,2.5),rx('incline_db_curl',3,10,15,2,75,2)
  ]},
  {id:'r_lower_b',name:'Lower B',weekday:4,version:1,archivedVersions:[],exercises:[
   rx('rdl',2,8,12,2,150,5),rx('leg_press',2,10,15,2,150,10),rx('split_squat',2,8,10,2,120,2),rx('seated_leg_curl',3,10,15,2,120,5),rx('hip_abduction',2,15,20,2,75,5),rx('hip_adduction',2,12,20,2,75,5),rx('standing_calf',3,10,20,2,90,5),rx('pallof',2,10,15,2,60,2.5)
  ]}
 ],workouts:[],measurements:[],activeWorkout:null};}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch{state=defaultState()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function ex(id){return state.exercises.find(e=>e.id===id)||{id,name:'Unknown exercise',primary:[],secondary:[],defaultIncrement:1,unit:'kg'}}
function routine(id){return state.routines.find(r=>r.id===id)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}
function applyTheme(){document.documentElement.dataset.theme=state.settings.theme||'dark';document.querySelector('meta[name="theme-color"]').content=state.settings.theme==='light'?'#f5f7f9':'#0b0d10'}
applyTheme();

function showView(v){currentView=v;Object.entries(views).forEach(([k,n])=>n.classList.toggle('active',k===v));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));renderView(v);window.scrollTo({top:0,behavior:'smooth'})}

function completedWorkouts(){return state.workouts.filter(w=>w.endedAt).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))}
function completedSets(w){return w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.completed).length,0)}
function weekStart(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function workoutsThisWeek(){const s=weekStart();return completedWorkouts().filter(w=>new Date(w.startedAt)>=s)}
function latestRoutineForToday(){const day=new Date().getDay();return state.routines.find(r=>r.weekday===day)||null}
function lastWorkout(){return completedWorkouts()[0]||null}
function allExerciseSessions(exId){return completedWorkouts().flatMap(w=>{const ew=w.exercises.find(e=>e.exerciseId===exId);return ew?[{workout:w,exercise:ew}]:[]})}
function prescriptionFor(exId){for(const r of state.routines){const p=r.exercises.find(x=>x.exerciseId===exId);if(p)return p}return null}
function previousExercise(exId,beforeIso=null){return allExerciseSessions(exId).find(s=>!beforeIso||new Date(s.workout.startedAt)<new Date(beforeIso))||null}
function getSuggestion(exId,p){
 const hist=allExerciseSessions(exId); if(!hist.length)return {kind:'new',weight:null,text:'No history yet — choose a comfortable starting load.',short:'Set baseline'};
 const s=hist[0].exercise.sets.filter(x=>x.completed&&Number(x.weight)>0&&Number(x.reps)>0); if(!s.length)return {kind:'new',weight:null,text:'Previous session has no weighted working sets.',short:'Set baseline'};
 const inc=Number(p?.increment||ex(exId).defaultIncrement||1), min=Number(p?.repMin||1), max=Number(p?.repMax||999);
 const ws=s.map(x=>Number(x.weight)), maxW=Math.max(...ws), minW=Math.min(...ws), same=Math.abs(maxW-minW)<0.001;
 const rirSets=s.filter(x=>x.rir!==''&&x.rir!=null&&Number.isFinite(Number(x.rir)));
 const avgRir=rirSets.length?rirSets.reduce((a,x)=>a+Number(x.rir),0)/rirSets.length:NaN;
 const allTop=s.every(x=>Number(x.reps)>=max), anyBelow=s.some(x=>Number(x.reps)<min);
 if(!same){const heavy=s.filter(x=>Number(x.weight)===maxW);const heavyOK=heavy.every(x=>Number(x.reps)>=min)&&heavy.some(x=>Number(x.reps)>=max);if(heavyOK)return {kind:'consolidate',weight:maxW,text:`You reached ${maxW} ${ex(exId).unit} successfully. Use it as the main working load before increasing again.`,short:`Consolidate ${maxW} ${ex(exId).unit}`};}
 if(allTop && (isNaN(avgRir)||avgRir>=1))return {kind:'up',weight:round(maxW+inc,2),text:`All working sets reached the top of the rep range. Increase by ${inc} ${ex(exId).unit}.`,short:`Increase to ${round(maxW+inc,2)} ${ex(exId).unit}`};
 if(anyBelow && !isNaN(avgRir) && avgRir<=.5)return {kind:'down',weight:Math.max(0,round(maxW-inc,2)),text:`Reps fell below target near failure. A small load reduction may restore quality.`,short:`Consider ${Math.max(0,round(maxW-inc,2))} ${ex(exId).unit}`};
 const recent=hist.slice(0,3).map(h=>Math.max(0,...h.exercise.sets.filter(x=>x.completed).map(x=>e1rm(Number(x.weight)||0,Number(x.reps)||0))));
 const stalled=recent.length>=3 && Math.max(...recent)-Math.min(...recent)<Math.max(1,recent[0]*.015);
 return {kind:stalled?'stall':'hold',weight:maxW,text:stalled?`Performance has been nearly flat for 3 sessions. Repeat the load, improve reps/RIR, or consider a small exercise adjustment.`:`Stay at ${maxW} ${ex(exId).unit} and add reps before adding load.`,short:stalled?'Plateau watch':`Repeat ${maxW} ${ex(exId).unit}`};
}
function progressionReady(){const arr=[];state.exercises.forEach(e=>{const p=prescriptionFor(e.id);if(!p)return;const s=getSuggestion(e.id,p);if(['up','consolidate','stall'].includes(s.kind))arr.push({e,p,s})});return arr.slice(0,5)}
function durationText(ms){const m=Math.max(1,Math.round(ms/60000));return m<60?`${m} min`:`${Math.floor(m/60)}h ${m%60}m`}

function renderHome(){
 const r=latestRoutineForToday(), week=workoutsThisWeek(), last=lastWorkout(), ready=progressionReady();
 const recentPRs=calcPRs().slice(0,2);
 views.home.innerHTML=`
 <h1 class="page-title">Train with intent.</h1><div class="sub">Log fast. Progress intelligently.</div>
 <div class="section">${state.activeWorkout?`<div class="card hero"><div class="eyebrow">Workout in progress</div><h2>${esc(state.activeWorkout.routineName)}</h2><div class="meta">Started ${dtFmt(state.activeWorkout.startedAt)} · ${state.activeWorkout.exercises.length} exercises</div><button class="btn primary" id="resumeBtn">Resume workout</button></div>`:
 r?`<div class="card hero"><div class="eyebrow">Today · ${dayNames[new Date().getDay()]}</div><h2>${esc(r.name)}</h2><div class="meta">${r.exercises.length} exercises · ${r.exercises.reduce((a,x)=>a+x.sets,0)} planned sets · v${r.version}</div><button class="btn primary" data-start="${r.id}">Start ${esc(r.name)}</button></div>`:
 `<div class="card hero"><div class="eyebrow">Today</div><h2>Recovery / unplanned day</h2><div class="meta">Start any routine when you're ready.</div><button class="btn primary" id="chooseRoutineBtn">Choose workout</button></div>`}</div>
 <div class="grid3"><div class="metric"><div class="v">${week.length}</div><div class="k">Workouts this week</div></div><div class="metric"><div class="v">${week.reduce((n,w)=>n+completedSets(w),0)}</div><div class="k">Working sets</div></div><div class="metric"><div class="v">${completedWorkouts().length}</div><div class="k">Total workouts</div></div></div>
 <div class="section"><div class="section-head"><h2 class="section-title">Progression queue</h2><button class="linkbtn" data-go="progress">View progress</button></div>${ready.length?`<div class="list">${ready.map(x=>`<div class="list-item"><div class="li-main"><div class="li-title">${esc(x.e.name)}</div><div class="li-sub">${esc(x.s.short)}</div></div><span class="pill ${x.s.kind==='up'?'good':x.s.kind==='stall'?'warn':'blue'}">${x.s.kind==='up'?'↑ Ready':x.s.kind==='stall'?'Plateau':'Next'}</span></div>`).join('')}</div>`:`<div class="card flat empty">Log a few workouts and progression recommendations will appear here.</div>`}</div>
 <div class="section desktop-grid"><div><div class="section-head"><h2 class="section-title">Last workout</h2></div>${last?`<div class="card flat"><div class="li-title">${esc(last.routineName)}</div><div class="li-sub">${dateFmt(last.startedAt)} · ${completedSets(last)} sets · ${durationText(new Date(last.endedAt)-new Date(last.startedAt))}</div></div>`:`<div class="card flat empty">No completed workouts yet.</div>`}</div><div><div class="section-head"><h2 class="section-title">Recent PRs</h2></div>${recentPRs.length?recentPRs.map(pr=>prHtml(pr)).join(''):`<div class="card flat empty">PRs appear automatically as you train.</div>`}</div></div>`;
 bindCommon(views.home);
 document.getElementById('resumeBtn')?.addEventListener('click',()=>showView('workout'));
 document.getElementById('chooseRoutineBtn')?.addEventListener('click',()=>showView('routines'));
}

function startWorkout(rid){if(state.activeWorkout){toast('Finish or discard the current workout first.');showView('workout');return}const r=routine(rid);if(!r)return;state.activeWorkout={id:uid('w'),routineId:r.id,routineName:r.name,routineVersion:r.version,startedAt:new Date().toISOString(),notes:'',exercises:r.exercises.map(p=>({rxId:p.id,exerciseId:p.exerciseId,prescription:clone(p),note:'',sets:Array.from({length:p.sets},(_,i)=>({id:uid('set'),index:i+1,weight:'',reps:'',rir:'',completed:false}))}))};save();showView('workout')}
function updateActive(fn){if(!state.activeWorkout)return;fn(state.activeWorkout);save()}
function renderWorkout(){
 if(!state.activeWorkout){views.workout.innerHTML=`<h1 class="page-title">Workout</h1><div class="sub">Choose a routine to start.</div><div class="section list">${state.routines.map(r=>`<div class="list-item"><div class="li-main"><div class="li-title">${esc(r.name)}</div><div class="li-sub">${r.exercises.length} exercises · ${r.exercises.reduce((a,x)=>a+x.sets,0)} sets</div></div><button class="btn small primary" data-start="${r.id}">Start</button></div>`).join('')}</div>`;bindCommon(views.workout);return;}
 const w=state.activeWorkout;
 views.workout.innerHTML=`<div class="workout-head"><div><h1 class="page-title">${esc(w.routineName)}</h1><div class="sub">Routine v${w.routineVersion} · <span id="sessionTime" class="session-timer"></span></div></div><button class="btn small secondary" id="workoutMenuBtn">•••</button></div>
 <div id="restbar" class="restbar"><div><div class="sub">Rest timer</div><div class="resttime" id="resttime">0:00</div></div><div class="btnrow"><button class="btn small secondary" data-restadd="30">+30s</button><button class="btn small" id="skipRest">Skip</button></div></div>
 <div class="section">${w.exercises.map((ew,ei)=>exerciseWorkoutHtml(ew,ei,w.startedAt)).join('')}</div>
 <div class="card flat"><div class="form-group"><label class="label">Workout note</label><textarea id="workoutNote" class="textarea" placeholder="Energy, pain, technique, anything worth remembering…">${esc(w.notes||'')}</textarea></div><div class="btnrow"><button class="btn primary" id="finishWorkout">Finish workout</button><button class="btn secondary" id="addExerciseWorkout">Add exercise</button></div></div>`;
 bindWorkout(); updateSessionTime(); clearInterval(renderWorkout._clock);renderWorkout._clock=setInterval(updateSessionTime,1000);renderRestBar();
}
function exerciseWorkoutHtml(ew,ei,beforeIso){const e=ex(ew.exerciseId),p=ew.prescription,prev=previousExercise(e.id,beforeIso),sug=getSuggestion(e.id,p);const prevSets=prev?.exercise.sets.filter(x=>x.completed)||[];return `<div class="exercise-card" data-ei="${ei}"><div class="exercise-header"><div class="exercise-title"><div><div class="exercise-name">${esc(e.name)}</div><div class="exercise-presc">${p.sets} sets · ${p.repMin}–${p.repMax} reps · ${p.targetRir} RIR · ${p.restSec}s rest</div></div><button class="iconbtn exmenu" data-ei="${ei}" aria-label="Exercise menu">•••</button></div><div class="suggest"><div class="s-main"><strong>${esc(sug.short)}</strong><br><span class="sub">${esc(sug.text)}</span></div>${sug.weight!=null?`<button class="btn small" data-fillweight="${ei}" data-weight="${sug.weight}">Use ${sug.weight}</button>`:''}</div></div><table class="set-table"><thead><tr><th>Set</th><th>Previous</th><th>${esc(e.unit)}</th><th>Reps</th><th>RIR</th><th>✓</th></tr></thead><tbody>${ew.sets.map((set,si)=>`<tr><td><span class="setnum">${si+1}</span></td><td class="prev">${prevSets[si]?`${prevSets[si].weight||'—'}×${prevSets[si].reps||'—'}`:'—'}</td><td><input class="setinput" inputmode="decimal" data-field="weight" data-ei="${ei}" data-si="${si}" value="${esc(set.weight)}" aria-label="Weight set ${si+1}"></td><td><input class="setinput" inputmode="numeric" data-field="reps" data-ei="${ei}" data-si="${si}" value="${esc(set.reps)}" aria-label="Reps set ${si+1}"></td><td><input class="setinput" inputmode="decimal" data-field="rir" data-ei="${ei}" data-si="${si}" value="${esc(set.rir)}" aria-label="RIR set ${si+1}"></td><td><button class="complete-btn ${set.completed?'done':''}" data-complete="${ei}:${si}" aria-label="Complete set ${si+1}">${set.completed?'✓':'○'}</button></td></tr>`).join('')}</tbody></table><div class="exercise-footer"><button class="btn small secondary" data-addset="${ei}">+ Set</button><span class="pill">${e.primary.join(' + ')}</span></div><div style="padding:0 12px 12px"><textarea class="note-input" data-exnote="${ei}" placeholder="Exercise note…">${esc(ew.note||'')}</textarea></div></div>`}
function bindWorkout(){const root=views.workout;root.querySelectorAll('.setinput').forEach(i=>i.addEventListener('change',()=>{const ei=+i.dataset.ei,si=+i.dataset.si,f=i.dataset.field;updateActive(w=>w.exercises[ei].sets[si][f]=i.value)}));root.querySelectorAll('[data-complete]').forEach(b=>b.addEventListener('click',()=>{const [ei,si]=b.dataset.complete.split(':').map(Number);const set=state.activeWorkout.exercises[ei].sets[si];if(!set.completed){if(!(Number(set.reps)>0)){toast('Enter reps before completing the set.');return}set.completed=true;b.classList.add('done');b.textContent='✓';const rest=state.activeWorkout.exercises[ei].prescription.restSec;if(state.settings.autoTimer)startRest(rest)}else{set.completed=false;b.classList.remove('done');b.textContent='○'}save()}));root.querySelectorAll('[data-fillweight]').forEach(b=>b.addEventListener('click',()=>{const ei=+b.dataset.fillweight,val=b.dataset.weight;state.activeWorkout.exercises[ei].sets.forEach(s=>{if(!s.weight)s.weight=val});save();renderWorkout()}));root.querySelectorAll('[data-addset]').forEach(b=>b.addEventListener('click',()=>{const ew=state.activeWorkout.exercises[+b.dataset.addset];ew.sets.push({id:uid('set'),index:ew.sets.length+1,weight:'',reps:'',rir:'',completed:false});save();renderWorkout()}));root.querySelectorAll('[data-exnote]').forEach(t=>t.addEventListener('change',()=>{state.activeWorkout.exercises[+t.dataset.exnote].note=t.value;save()}));root.querySelectorAll('.exmenu').forEach(b=>b.addEventListener('click',()=>openWorkoutExerciseMenu(+b.dataset.ei)));document.getElementById('workoutNote').addEventListener('change',e=>{state.activeWorkout.notes=e.target.value;save()});document.getElementById('finishWorkout').addEventListener('click',finishWorkout);document.getElementById('workoutMenuBtn').addEventListener('click',openWorkoutMenu);document.getElementById('addExerciseWorkout').addEventListener('click',()=>openExercisePicker(id=>{const e=ex(id);state.activeWorkout.exercises.push({rxId:null,exerciseId:id,prescription:{exerciseId:id,sets:3,repMin:8,repMax:12,targetRir:2,restSec:90,increment:e.defaultIncrement},note:'',sets:Array.from({length:3},(_,i)=>({id:uid('set'),index:i+1,weight:'',reps:'',rir:'',completed:false}))});save();closeModal();renderWorkout()}));document.getElementById('skipRest')?.addEventListener('click',stopRest);root.querySelectorAll('[data-restadd]').forEach(b=>b.addEventListener('click',()=>{restTimer.end+=Number(b.dataset.restadd)*1000;renderRestBar()}))}
function updateSessionTime(){const n=document.getElementById('sessionTime');if(n&&state.activeWorkout)n.textContent=durationText(Date.now()-new Date(state.activeWorkout.startedAt))}
function startRest(sec){restTimer.end=Date.now()+Number(sec)*1000;clearInterval(restTimer.interval);restTimer.interval=setInterval(renderRestBar,250);renderRestBar()}
function stopRest(){restTimer.end=0;clearInterval(restTimer.interval);renderRestBar()}
function renderRestBar(){const bar=document.getElementById('restbar'),t=document.getElementById('resttime');if(!bar||!t)return;const left=Math.ceil((restTimer.end-Date.now())/1000);if(left>0){bar.classList.add('active');t.textContent=mmss(left)}else{bar.classList.remove('active');if(restTimer.end){restTimer.end=0;clearInterval(restTimer.interval);navigator.vibrate?.(80)}}}
function finishWorkout(){const w=state.activeWorkout;if(!w)return;const done=w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.completed).length,0);if(!done){toast('Complete at least one set first.');return}w.endedAt=new Date().toISOString();w.exercises=w.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.completed)})).filter(e=>e.sets.length);state.workouts.push(clone(w));state.activeWorkout=null;stopRest();save();toast('Workout saved.');showView('home')}
function openWorkoutMenu(){openModal(`<div class="sheet-head"><div class="sheet-title">Workout options</div><button class="closex" data-close>×</button></div><div class="list"><button class="btn full secondary" id="discardWorkout">Discard workout</button></div>`);document.getElementById('discardWorkout').addEventListener('click',()=>{if(confirm('Discard this active workout?')){state.activeWorkout=null;save();closeModal();showView('workout')}})}
function openWorkoutExerciseMenu(ei){const ew=state.activeWorkout.exercises[ei];openModal(`<div class="sheet-head"><div class="sheet-title">${esc(ex(ew.exerciseId).name)}</div><button class="closex" data-close>×</button></div><div class="btnrow"><button class="btn danger" id="removeExActive">Remove exercise</button></div>`);document.getElementById('removeExActive').addEventListener('click',()=>{state.activeWorkout.exercises.splice(ei,1);save();closeModal();renderWorkout()})}

function renderRoutines(){views.routines.innerHTML=`<div class="section-head"><div><h1 class="page-title">Routines</h1><div class="sub">Program the workout once. Log it fast later.</div></div><button class="btn small primary" id="newRoutine">+ Routine</button></div><div class="section">${state.routines.map(r=>routineHtml(r)).join('')}</div>`;views.routines.querySelectorAll('[data-editroutine]').forEach(b=>b.addEventListener('click',()=>openRoutineBuilder(b.dataset.editroutine)));views.routines.querySelectorAll('[data-duproutine]').forEach(b=>b.addEventListener('click',()=>duplicateRoutine(b.dataset.duproutine)));bindCommon(views.routines);document.getElementById('newRoutine').addEventListener('click',()=>openRoutineBuilder(null))}
function routineHtml(r){return `<div class="card routine-card"><div class="top"><div><div class="routine-name">${esc(r.name)}</div><div class="li-sub">${r.weekday==null?'No fixed day':dayNames[r.weekday]} · v${r.version} · ${r.exercises.reduce((a,x)=>a+x.sets,0)} sets</div></div><span class="pill">${r.exercises.length} exercises</span></div><div class="routine-exs">${r.exercises.map(x=>`<span class="pill">${esc(ex(x.exerciseId).name)}</span>`).join('')}</div><div class="routine-actions"><button class="btn small primary" data-start="${r.id}">Start</button><button class="btn small secondary" data-editroutine="${r.id}">Edit</button><button class="btn small secondary" data-duproutine="${r.id}">Duplicate</button></div></div>`}
function duplicateRoutine(id){const r=clone(routine(id));r.id=uid('routine');r.name+=' Copy';r.version=1;r.archivedVersions=[];r.exercises.forEach(x=>x.id=uid('rx'));state.routines.push(r);save();renderRoutines();toast('Routine duplicated.')}
let builderDraft=null;
function openRoutineBuilder(id){builderDraft=id?clone(routine(id)):{id:null,name:'New Routine',weekday:null,version:1,archivedVersions:[],exercises:[]};renderBuilder()}
function renderBuilder(){openModal(`<div class="sheet-head"><div class="sheet-title">${builderDraft.id?'Edit routine':'New routine'}</div><button class="closex" data-close>×</button></div><div class="form-grid"><div class="form-group"><label class="label">Routine name</label><input id="brName" class="input" value="${esc(builderDraft.name)}"></div><div class="form-group"><label class="label">Scheduled day</label><select id="brDay" class="select"><option value="">No fixed day</option>${dayNames.map((d,i)=>`<option value="${i}" ${builderDraft.weekday===i?'selected':''}>${d}</option>`).join('')}</select></div></div><div class="section-head"><h3 class="section-title">Exercises</h3><button class="btn small" id="builderAddEx">+ Exercise</button></div><div id="builderList">${builderDraft.exercises.length?builderDraft.exercises.map((x,i)=>builderExHtml(x,i)).join(''):'<div class="empty">Add your first exercise.</div>'}</div><div class="section"><button class="btn primary full" id="saveRoutine">Save routine</button>${builderDraft.id?`<button class="btn danger full" style="margin-top:8px" id="deleteRoutine">Delete routine</button>`:''}</div>`);document.getElementById('builderAddEx').addEventListener('click',()=>openExercisePicker(id=>{const e=ex(id);builderDraft.exercises.push({id:uid('rx'),exerciseId:id,sets:3,repMin:8,repMax:12,targetRir:2,restSec:90,increment:e.defaultIncrement});renderBuilder()}));document.getElementById('brName').addEventListener('change',e=>builderDraft.name=e.target.value.trim()||'Routine');document.getElementById('brDay').addEventListener('change',e=>builderDraft.weekday=e.target.value===''?null:Number(e.target.value));document.getElementById('saveRoutine').addEventListener('click',saveRoutineBuilder);document.getElementById('deleteRoutine')?.addEventListener('click',()=>{if(confirm('Delete this routine? Existing workout history will stay.')){state.routines=state.routines.filter(r=>r.id!==builderDraft.id);save();closeModal();renderRoutines()}});bindBuilderRows()}
function builderExHtml(x,i){return `<div class="builder-ex" data-bi="${i}"><div class="rowtop"><div><strong>${esc(ex(x.exerciseId).name)}</strong><div class="li-sub">${esc(ex(x.exerciseId).primary.join(' + '))}</div></div><div class="movebtns"><button data-move="up" data-i="${i}">↑</button><button data-move="down" data-i="${i}">↓</button><button data-removebi="${i}">×</button></div></div><div class="builder-fields"><div><div class="builder-label">Sets</div><input class="input" inputmode="numeric" data-bf="sets" data-i="${i}" value="${x.sets}"></div><div><div class="builder-label">Rep min</div><input class="input" inputmode="numeric" data-bf="repMin" data-i="${i}" value="${x.repMin}"></div><div><div class="builder-label">Rep max</div><input class="input" inputmode="numeric" data-bf="repMax" data-i="${i}" value="${x.repMax}"></div><div><div class="builder-label">Target RIR</div><input class="input" inputmode="decimal" data-bf="targetRir" data-i="${i}" value="${x.targetRir}"></div><div><div class="builder-label">Rest sec</div><input class="input" inputmode="numeric" data-bf="restSec" data-i="${i}" value="${x.restSec}"></div><div><div class="builder-label">Increment</div><input class="input" inputmode="decimal" data-bf="increment" data-i="${i}" value="${x.increment}"></div></div></div>`}
function bindBuilderRows(){document.querySelectorAll('[data-bf]').forEach(i=>i.addEventListener('change',()=>{const idx=+i.dataset.i,f=i.dataset.bf,v=Number(i.value);if(Number.isFinite(v)){builderDraft.exercises[idx][f]=v}}));document.querySelectorAll('[data-removebi]').forEach(b=>b.addEventListener('click',()=>{builderDraft.exercises.splice(+b.dataset.removebi,1);renderBuilder()}));document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i,j=b.dataset.move==='up'?i-1:i+1;if(j<0||j>=builderDraft.exercises.length)return;[builderDraft.exercises[i],builderDraft.exercises[j]]=[builderDraft.exercises[j],builderDraft.exercises[i]];renderBuilder()}))}
function saveRoutineBuilder(){builderDraft.name=document.getElementById('brName').value.trim()||'Routine';builderDraft.weekday=document.getElementById('brDay').value===''?null:Number(document.getElementById('brDay').value);if(!builderDraft.exercises.length){toast('Add at least one exercise.');return}for(const x of builderDraft.exercises){x.sets=Math.max(1,Math.min(10,Number(x.sets)||1));x.repMin=Math.max(1,Number(x.repMin)||1);x.repMax=Math.max(x.repMin,Number(x.repMax)||x.repMin);x.restSec=Math.max(0,Number(x.restSec)||0);x.increment=Math.max(.1,Number(x.increment)||1)}if(builderDraft.id){const old=routine(builderDraft.id);const archive=clone(old);delete archive.archivedVersions;builderDraft.archivedVersions=old.archivedVersions||[];builderDraft.archivedVersions.push(archive);builderDraft.version=(old.version||1)+1;state.routines[state.routines.findIndex(r=>r.id===builderDraft.id)]=clone(builderDraft)}else{builderDraft.id=uid('routine');builderDraft.version=1;state.routines.push(clone(builderDraft))}save();closeModal();renderRoutines();toast('Routine saved as a new version.')}

function renderProgress(){if(!selectedProgressExercise){selectedProgressExercise=state.exercises.find(e=>allExerciseSessions(e.id).length)?.id||state.exercises[0]?.id}views.progress.innerHTML=`<h1 class="page-title">Progress</h1><div class="sub">See whether your training is actually moving forward.</div><div class="section"><div class="seg"><button data-pt="exercise" class="${progressTab==='exercise'?'active':''}">Exercise</button><button data-pt="volume" class="${progressTab==='volume'?'active':''}">Volume</button><button data-pt="prs" class="${progressTab==='prs'?'active':''}">PRs</button><button data-pt="body" class="${progressTab==='body'?'active':''}">Body</button></div></div><div id="progressBody">${progressBodyHtml()}</div>`;views.progress.querySelectorAll('[data-pt]').forEach(b=>b.addEventListener('click',()=>{progressTab=b.dataset.pt;renderProgress()}));bindProgress()}
function progressBodyHtml(){if(progressTab==='exercise')return exerciseProgressHtml();if(progressTab==='volume')return volumeHtml();if(progressTab==='prs')return prsHtml();return bodyHtml()}
function exerciseProgressHtml(){const e=ex(selectedProgressExercise),sessions=allExerciseSessions(e.id).slice().reverse();const p=prescriptionFor(e.id),sug=p?getSuggestion(e.id,p):null;const pts=sessions.map(s=>{const sets=s.exercise.sets.filter(x=>x.completed);return {date:s.workout.startedAt,best:Math.max(0,...sets.map(x=>e1rm(Number(x.weight)||0,Number(x.reps)||0))),weight:Math.max(0,...sets.map(x=>Number(x.weight)||0)),reps:Math.max(0,...sets.map(x=>Number(x.reps)||0))}});const latest=pts.at(-1);return `<div class="form-group"><label class="label">Exercise</label><select id="progressExercise" class="select">${state.exercises.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${sug?`<div class="card flat"><div class="eyebrow sub">Next session</div><div class="routine-name" style="margin-top:5px">${esc(sug.short)}</div><div class="li-sub">${esc(sug.text)}</div></div>`:''}<div class="grid3 section"><div class="metric"><div class="v">${latest?.weight||'—'}</div><div class="k">Latest max load ${esc(e.unit)}</div></div><div class="metric"><div class="v">${latest?.reps||'—'}</div><div class="k">Best reps</div></div><div class="metric"><div class="v">${latest?.best?round(latest.best,1):'—'}</div><div class="k">Est. 1RM</div></div></div><div class="section"><div class="section-head"><h2 class="section-title">Estimated strength</h2></div>${pts.length?chartHtml(pts):'<div class="card flat empty">Complete this exercise to build a trend.</div>'}</div><div class="section"><div class="section-head"><h2 class="section-title">History</h2></div><div class="list">${allExerciseSessions(e.id).slice(0,12).map(s=>`<div class="list-item"><div class="li-main"><div class="li-title">${dateFmt(s.workout.startedAt)} · ${esc(s.workout.routineName)}</div><div class="li-sub">${s.exercise.sets.filter(x=>x.completed).map(x=>`${x.weight||'—'}×${x.reps||'—'}${x.rir!==''?` @${x.rir}RIR`:''}`).join(' · ')}</div></div></div>`).join('')||'<div class="empty">No history yet.</div>'}</div></div>`}
function chartHtml(pts){const W=640,H=210,pad=30;const ys=pts.map(p=>p.best);let min=Math.min(...ys),max=Math.max(...ys);if(max===min){min=Math.max(0,min-1);max+=1}const coords=pts.map((p,i)=>({x:pad+(W-2*pad)*(pts.length===1?.5:i/(pts.length-1)),y:H-pad-(H-2*pad)*(p.best-min)/(max-min),...p}));return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated one rep max trend"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}"/><text x="4" y="${pad+4}">${round(max,1)}</text><text x="4" y="${H-pad}">${round(min,1)}</text>${coords.length>1?`<polyline class="line" points="${coords.map(c=>`${c.x},${c.y}`).join(' ')}"/>`:''}${coords.map(c=>`<circle class="dot" cx="${c.x}" cy="${c.y}" r="5"><title>${dateFmt(c.date)}: ${round(c.best,1)}</title></circle>`).join('')}<text x="${pad}" y="${H-6}">${dateFmt(pts[0].date)}</text><text text-anchor="end" x="${W-pad}" y="${H-6}">${dateFmt(pts.at(-1).date)}</text></svg></div>`}
function muscleSets(periodDays=7){const cutoff=new Date();cutoff.setDate(cutoff.getDate()-periodDays);const map={};completedWorkouts().filter(w=>new Date(w.startedAt)>=cutoff).forEach(w=>w.exercises.forEach(ew=>{const e=ex(ew.exerciseId),sets=ew.sets.filter(s=>s.completed).length;e.primary.forEach(m=>map[m]=(map[m]||0)+sets);e.secondary.forEach(m=>map[m]=(map[m]||0)+sets*Number(state.settings.secondarySetFactor||.5))}));return Object.entries(map).sort((a,b)=>b[1]-a[1])}
function volumeHtml(){const m=muscleSets(7),max=Math.max(1,...m.map(x=>x[1]));return `<div class="section"><div class="section-head"><div><h2 class="section-title">Last 7 days</h2><div class="sub">Primary sets count 1.0; secondary contribution ${state.settings.secondarySetFactor}.</div></div></div><div class="card flat">${m.length?m.map(([k,v])=>`<div class="barrow"><div class="barhead"><strong>${esc(k)}</strong><span>${round(v,1)} effective sets</span></div><div class="bar"><span style="width:${Math.min(100,v/max*100)}%"></span></div></div>`).join(''):'<div class="empty">Complete workouts to see muscle volume.</div>'}</div></div><div class="section"><div class="section-head"><h2 class="section-title">Planned weekly routine volume</h2></div><div class="card flat">${plannedVolumeHtml()}</div></div>`}
function plannedVolumeHtml(){const map={};state.routines.forEach(r=>r.exercises.forEach(p=>{const e=ex(p.exerciseId);e.primary.forEach(m=>map[m]=(map[m]||0)+p.sets);e.secondary.forEach(m=>map[m]=(map[m]||0)+p.sets*Number(state.settings.secondarySetFactor||.5))}));const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...arr.map(x=>x[1]));return arr.map(([k,v])=>`<div class="barrow"><div class="barhead"><strong>${esc(k)}</strong><span>${round(v,1)}</span></div><div class="bar"><span style="width:${v/max*100}%"></span></div></div>`).join('')}
function calcPRs(){const best={};completedWorkouts().slice().reverse().forEach(w=>w.exercises.forEach(ew=>ew.sets.filter(s=>s.completed).forEach(s=>{const key=ew.exerciseId,score=e1rm(Number(s.weight)||0,Number(s.reps)||0);if(!best[key]||score>best[key].score){best[key]={exerciseId:key,score,weight:Number(s.weight)||0,reps:Number(s.reps)||0,date:w.startedAt,routineName:w.routineName}}})));return Object.values(best).sort((a,b)=>new Date(b.date)-new Date(a.date))}
function prHtml(pr){return `<div class="card flat pr"><div class="pr-icon">★</div><div><div class="li-title">${esc(ex(pr.exerciseId).name)}</div><div class="li-sub">${pr.weight} ${esc(ex(pr.exerciseId).unit)} × ${pr.reps} · e1RM ${round(pr.score,1)}</div></div><div class="pr-date">${dateFmt(pr.date)}</div></div>`}
function prsHtml(){const prs=calcPRs();return `<div class="section"><div class="section-head"><h2 class="section-title">Current bests</h2></div>${prs.length?prs.map(pr=>prHtml(pr)).join(''):'<div class="card flat empty">PRs will appear automatically.</div>'}</div>`}
function bodyHtml(){const rows=state.measurements.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card flat"><div class="form-grid three"><div class="form-group"><label class="label">Date</label><input class="input" type="date" id="mDate" value="${todayISO()}"></div><div class="form-group"><label class="label">Weight (kg)</label><input class="input" inputmode="decimal" id="mWeight" placeholder="90"></div><div class="form-group"><label class="label">Waist (cm)</label><input class="input" inputmode="decimal" id="mWaist" placeholder="97"></div></div><div class="form-grid"><div class="form-group"><label class="label">Chest (cm)</label><input class="input" inputmode="decimal" id="mChest"></div><div class="form-group"><label class="label">Arm (cm)</label><input class="input" inputmode="decimal" id="mArm"></div></div><button class="btn primary" id="saveMeasurement">Save measurement</button></div><div class="section"><div class="section-head"><h2 class="section-title">History</h2></div><div class="list">${rows.map(m=>`<div class="list-item"><div class="li-main"><div class="li-title">${dateFmt(m.date)}</div><div class="li-sub">${m.weight?`${m.weight} kg · `:''}${m.waist?`Waist ${m.waist} cm · `:''}${m.chest?`Chest ${m.chest} cm · `:''}${m.arm?`Arm ${m.arm} cm`:''}</div></div><button class="btn small secondary" data-delmeasure="${m.id}">Delete</button></div>`).join('')||'<div class="empty">No measurements yet.</div>'}</div></div>`}
function bindProgress(){document.getElementById('progressExercise')?.addEventListener('change',e=>{selectedProgressExercise=e.target.value;renderProgress()});document.getElementById('saveMeasurement')?.addEventListener('click',()=>{const obj={id:uid('m'),date:document.getElementById('mDate').value||todayISO(),weight:Number(document.getElementById('mWeight').value)||null,waist:Number(document.getElementById('mWaist').value)||null,chest:Number(document.getElementById('mChest').value)||null,arm:Number(document.getElementById('mArm').value)||null};if(!obj.weight&&!obj.waist&&!obj.chest&&!obj.arm){toast('Enter at least one measurement.');return}state.measurements.push(obj);save();renderProgress();toast('Measurement saved.')});views.progress.querySelectorAll('[data-delmeasure]').forEach(b=>b.addEventListener('click',()=>{state.measurements=state.measurements.filter(m=>m.id!==b.dataset.delmeasure);save();renderProgress()}))}

function renderMore(){views.more.innerHTML=`<h1 class="page-title">More</h1><div class="sub">Settings, exercises and your data.</div><div class="section"><div class="section-head"><h2 class="section-title">Training settings</h2></div><div class="card flat"><div class="checkrow"><div><strong>Automatic rest timer</strong><div class="li-sub">Starts when a set is completed.</div></div><button id="autoTimerSwitch" class="switch ${state.settings.autoTimer?'on':''}" aria-label="Automatic rest timer"></button></div><div class="form-group"><label class="label">Secondary-muscle set factor</label><input id="secondaryFactor" class="input" type="number" min="0" max="1" step="0.1" value="${state.settings.secondarySetFactor}"><div class="li-sub">Used only for muscle-volume analytics. Primary sets always count as 1.0.</div></div></div></div><div class="section"><div class="section-head"><h2 class="section-title">Exercise library</h2><button class="btn small" id="addCustomExercise">+ Custom</button></div><div class="card flat"><div class="li-title">${state.exercises.length} exercises</div><div class="li-sub">Built-in + custom exercises. Custom exercises can be used in any routine.</div></div></div><div class="section"><div class="section-head"><h2 class="section-title">Data & backup</h2></div><div class="card flat"><div class="btnrow"><button class="btn secondary" id="exportData">Export JSON</button><button class="btn secondary" id="importData">Import JSON</button></div><div class="li-sub" style="margin-top:10px">Everything is stored locally in your browser. Export backups regularly if this is your primary log.</div></div></div><div class="section"><div class="section-head"><h2 class="section-title">About</h2></div><div class="card flat"><div class="li-title">Progression v1.0</div><div class="li-sub">Offline-first workout logging with routine versioning, RIR-aware double progression, PR tracking and volume analytics.</div></div></div><div class="section"><div class="card flat dangerzone"><div class="li-title" style="color:var(--danger)">Danger zone</div><div class="li-sub">This permanently clears routines, history and measurements on this device.</div><button class="btn danger" style="margin-top:12px" id="resetApp">Reset app</button></div></div>`;document.getElementById('autoTimerSwitch').addEventListener('click',e=>{state.settings.autoTimer=!state.settings.autoTimer;e.currentTarget.classList.toggle('on',state.settings.autoTimer);save()});document.getElementById('secondaryFactor').addEventListener('change',e=>{state.settings.secondarySetFactor=Math.min(1,Math.max(0,Number(e.target.value)||0));save()});document.getElementById('addCustomExercise').addEventListener('click',openCustomExercise);document.getElementById('exportData').addEventListener('click',exportData);document.getElementById('importData').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('resetApp').addEventListener('click',()=>{if(confirm('Reset the entire app and delete all local data?')){state=defaultState();save();showView('home');toast('App reset.')}})}
function openCustomExercise(){openModal(`<div class="sheet-head"><div class="sheet-title">Custom exercise</div><button class="closex" data-close>×</button></div><div class="form-group"><label class="label">Name</label><input class="input" id="ceName"></div><div class="form-grid"><div class="form-group"><label class="label">Primary muscle</label><input class="input" id="cePrimary" placeholder="Chest"></div><div class="form-group"><label class="label">Secondary muscle</label><input class="input" id="ceSecondary" placeholder="Triceps"></div><div class="form-group"><label class="label">Unit</label><select class="select" id="ceUnit"><option>kg</option><option>lb</option><option>sec</option><option>bodyweight</option></select></div><div class="form-group"><label class="label">Default increment</label><input class="input" inputmode="decimal" id="ceInc" value="2.5"></div></div><button class="btn primary full" id="ceSave">Add exercise</button>`);document.getElementById('ceSave').addEventListener('click',()=>{const name=document.getElementById('ceName').value.trim();if(!name){toast('Enter an exercise name.');return}state.exercises.push({id:uid('ex'),name,category:'Custom',primary:[document.getElementById('cePrimary').value.trim()||'Other'],secondary:document.getElementById('ceSecondary').value.trim()?[document.getElementById('ceSecondary').value.trim()]:[],unit:document.getElementById('ceUnit').value,defaultIncrement:Number(document.getElementById('ceInc').value)||1,custom:true});save();closeModal();renderMore();toast('Exercise added.')})}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`progression-backup-${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.routines)||!Array.isArray(x.workouts))throw Error();if(confirm('Replace current app data with this backup?')){state=x;save();applyTheme();showView('home');toast('Backup imported.')}}catch{alert('That file is not a valid Progression backup.')}};r.readAsText(f);e.target.value=''})

function openExercisePicker(onPick){const byCat={};state.exercises.forEach(e=>(byCat[e.category]??=[]).push(e));openModal(`<div class="sheet-head"><div class="sheet-title">Choose exercise</div><button class="closex" data-close>×</button></div><div class="form-group"><input id="exerciseSearch" class="input" placeholder="Search exercises…"></div><div id="exercisePickerList">${exercisePickerList(byCat,'')}</div>`);const inp=document.getElementById('exerciseSearch');inp.addEventListener('input',()=>{document.getElementById('exercisePickerList').innerHTML=exercisePickerList(byCat,inp.value);bindPick()});function bindPick(){document.querySelectorAll('[data-pickex]').forEach(b=>b.addEventListener('click',()=>onPick(b.dataset.pickex)))}bindPick()}
function exercisePickerList(byCat,q){q=q.trim().toLowerCase();let html='';for(const [cat,arr] of Object.entries(byCat)){const f=arr.filter(e=>e.name.toLowerCase().includes(q)||e.primary.join(' ').toLowerCase().includes(q));if(!f.length)continue;html+=`<div class="section"><div class="label">${esc(cat)}</div><div class="list">${f.map(e=>`<button class="list-item" style="text-align:left;color:var(--text)" data-pickex="${e.id}"><div class="li-main"><div class="li-title">${esc(e.name)}</div><div class="li-sub">${esc(e.primary.join(' + '))} · +${e.defaultIncrement} ${esc(e.unit)}</div></div><span>›</span></button>`).join('')}</div></div>`}return html||'<div class="empty">No matching exercises.</div>'}
function openModal(html){const m=document.getElementById('modal'),s=document.getElementById('sheet');s.innerHTML=html;m.classList.add('open');m.setAttribute('aria-hidden','false');s.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal))}
function closeModal(){const m=document.getElementById('modal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function bindCommon(root){root.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>startWorkout(b.dataset.start)));root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.go)))}
function renderView(v){if(v==='home')renderHome();if(v==='workout')renderWorkout();if(v==='routines')renderRoutines();if(v==='progress')renderProgress();if(v==='more')renderMore()}
renderHome();
})();
</script>
</body>
</html>
